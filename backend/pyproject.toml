[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.3",
    "bcrypt==4.0.1",
    "fastapi[standard]>=0.141.1",
    "openpyxl>=3.1.5",
    "pandas<3.0.0",
    "numpy<2.0.0",
    "passlib[bcrypt]>=1.7.4",
    "pyjwt>=2.13.0",
    "pymysql>=1.2.0",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.39",
    "werkzeug>=3.1.3",
    "xlrd>=2.0.1",
    "slowapi>=0.1.10",
    "reportlab>=5.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
omit = ["*/__pycache__/*"]
